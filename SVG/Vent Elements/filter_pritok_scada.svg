<?xml version="1.0" encoding="UTF-8"?>
<!--
  Фильтр притока - элемент для MasterSCADA.
  Координатная система: 100x100 (viewBox).
  Масштаб вывода: 166.6667 px (~500/3) - средняя зона (60 единиц,
  y = 20..80) на экране ровно 100 px.

  ФИЛЬТРУЮЩИЕ ЭЛЕМЕНТЫ:
    Треугольные элементы в центре, направление потока слева направо.
    Параметр "FilterState" может менять состояние (чистый/загрязнён).

  Привязки (см. парный файл filter_pritok_scada.xml):
    #filter_media   fill       - цвет фильтрующего элемента
    #filter_media  opacity    - прозрачность (загрязнение)
    #pos_value     Content    - текст состояния (процент загрязнения)
    #pos_value     visibility - видимость текста
    #pos_value     fill       - цвет текста заголовка
    #status_text   Content    - текст нижней зоны
    #status_text   fill       - цвет текста нижней зоны
    #top_band      fill       - фон заголовка
    #mid_band      fill       - фон центральной части
    #bottom_band   fill       - фон нижней зоны
    #flow_arrow    fill       - цвет стрелки потока
    #frame_border  stroke     - цвет рамки
    #vibration     class      - вибрация фильтрующих элементов (On/Off)

  Русский текст задан XML-кодами символов (&#x...;), чтобы файл
  оставался чисто ASCII и не зависел от кодировки.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="166.6667"
  height="166.6667"
  viewBox="0 0 100 100"
  id="svg-filter-pritok-scada">
  <defs>
    <clipPath id="fps_tile_clip">
      <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="8" ry="8"/>
    </clipPath>

    <!-- Прототип треугольного фильтрующего элемента (увеличен в 2 раза, со скруглёнными углами).
         Центр в (0,0), основание по вертикали, вершина вправо (поток ->).
         Высота треугольника = 24, основание = 16. Радиус скругления = 2.5. -->
    <g id="filter_triangle_proto">
      <path d="M-12,-5.5 Q-12,-8 -9.5,-8 L9.5,-2.5 Q12,0 9.5,2.5 L-9.5,8 Q-12,8 -12,5.5 Z"
        stroke="#4b5563" stroke-width="0.5" stroke-linejoin="round"/>
    </g>

    <!-- Стрелка направления потока (для индикации) -->
    <g id="flow_arrow_proto">
      <path d="M-8,0 L8,0 M3,-4 L8,0 L3,4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style type="text/css"><![CDATA[
    /* ===== Вибрация фильтрующих элементов =====
       Параметр "Вибрация" (#vibration class On/Off).
       Верхний и нижний треугольники качаются синхронно,
       средний - в противофазе.
       Центр вращения - середина левой (вертикальной) стороны
       треугольника. Ось вращения (локальный 0,0 анимируемой
       группы) совпадает с левой стороной, а сам треугольник
       смещён на +12 по X, чтобы его центр оставался в (50,y). */
    #vibration.On .tri_vib {
      animation: tri_vibrate 1.2s ease-in-out infinite;
    }
    #vibration.On .tri_vib_anti {
      animation-direction: reverse;
    }
    #vibration.Off .tri_vib {
      animation: none;
    }
    @keyframes tri_vibrate {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(2.5deg); }
      75%  { transform: rotate(-2.5deg); }
      100% { transform: rotate(0deg); }
    }
  ]]></style>

  <g id="filter_pritok_scada">

    <!-- Рамка; внешний габарит ровно 100x100 в viewBox -->
    <rect id="frame_border"
      x="0.75" y="0.75" width="98.5" height="98.5"
      rx="8" ry="8"
      fill="none"
      stroke="#d1d5db"
      stroke-width="1.5"/>

    <g clip-path="url(#fps_tile_clip)">

      <!-- Фон центральной части (перекрывается полосами сверху/снизу) -->
      <rect id="mid_band" x="0.75" y="0.75" width="98.5" height="98.5" fill="#1a1d21"/>

      <!-- Фон заголовка (верхняя зона, процент загрязнения) -->
      <rect id="top_band" x="0.75" y="0.75" width="98.5" height="19.25" fill="#23272e"/>
      <line id="top_sep" x1="0.75" y1="20" x2="99.25" y2="20" stroke="#3b4048" stroke-width="1"/>

      <!-- Фон нижней зоны (текст состояния) -->
      <rect id="bottom_band" x="0.75" y="80" width="98.5" height="19.25" fill="#23272e"/>
      <line id="bottom_sep" x1="0.75" y1="80" x2="99.25" y2="80" stroke="#3b4048" stroke-width="1"/>

      <!-- Стрелки направления потока (слева направо) -->
      <g id="flow_arrows" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.6">
        <use xlink:href="#flow_arrow_proto" transform="translate(20,50)"/>
        <use xlink:href="#flow_arrow_proto" transform="translate(80,50)"/>
      </g>

      <!-- Фильтрующие элементы: 3 треугольника в центре центральной зоны (y=20..80).
           Центр в (50,50), треугольники увеличены в 2 раза (высота 24).
           Позиции: y=32, 50, 68 (верх/центр/низ внутри зоны с отступом 12).
           Базовый цвет задаётся на группе #filter_media (меняется через параметр FilterMediaColor).
           Вибрация управляется группой #vibration (class On/Off):
             - верхний и нижний треугольники качаются синхронно;
             - средний - в противофазе (класс tri_vib_anti);
             - центр вращения - середина левой стороны: ось (0,0)
               анимируемой группы стоит в (38,y), а треугольник
               смещён на +12 по X, чтобы его центр был в (50,y). -->
      <g id="filter_media" fill="#d1d5db" stroke="#4b5563" stroke-width="0.5">
        <g id="vibration" class="On">
          <g transform="translate(38,32)">
            <g class="tri_vib">
              <use id="tri_1" xlink:href="#filter_triangle_proto" transform="translate(12,0)"/>
            </g>
          </g>
          <g transform="translate(38,50)">
            <g class="tri_vib tri_vib_anti">
              <use id="tri_2" xlink:href="#filter_triangle_proto" transform="translate(12,0)"/>
            </g>
          </g>
          <g transform="translate(38,68)">
            <g class="tri_vib">
              <use id="tri_3" xlink:href="#filter_triangle_proto" transform="translate(12,0)"/>
            </g>
          </g>
        </g>
      </g>

      <!-- Рамочка вокруг фильтрующей зоны (внутри центральной зоны y=20..80, с запасом для больших треугольников) -->
      <rect x="30" y="20.5" width="40" height="59"
        fill="none" stroke="#3b4048" stroke-width="0.8" rx="3" ry="3"/>
    </g>

    <!-- Заголовок: процент загрязнения фильтра.
         Видимость - атрибут visibility ("visible" | "hidden"),
         цвет - атрибут fill -->
    <text id="pos_value"
      x="50" y="14.5"
      visibility="visible"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="11"
      font-weight="700"
      fill="#e5e7eb">0%</text>

    <!-- Нижняя зона: текст состояния, цвет - атрибут fill -->
    <text id="status_text"
      x="50" y="93"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="0.5"
      fill="#94a3b8">&#x427;&#x438;&#x441;&#x442;&#x43E;</text>
  </g>
</svg>
