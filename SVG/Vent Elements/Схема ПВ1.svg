<svg xmlns="http://w3.org" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <!-- Стрелки направления потока воздуха -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9ca3af" />
    </marker>
    
    <!-- Свечение для активных элементов -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Общий фон венткамеры -->
  <rect width="850" height="310" fill="#15171a" rx="10" />
  
  <!-- Заголовок системы -->
  <text x="30" y="35" fill="#f3f4f6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">ПРИТОЧНО-ВЫТЯЖНАЯ СИСТЕМА ПВ1 (ВЕРОСА-500-078)</text>

  <!-- ================= ОБОЗНАЧЕНИЕ ВОЗДУХОВОДОВ И НАПРАВЛЕНИЙ ================= -->
  <!-- Вытяжной канал (Верхний) -->
  <rect x="80" y="70" width="690" height="60" fill="#1e2227" stroke="#374151" stroke-width="2" />
  <text x="30" y="105" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">ИЗ ПОМ.</text>
  
  <!-- Стрелки и подписи направления в вытяжном канале -->
  <path d="M 100 100 L 120 100" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 335 100 L 350 100" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 485 100 L 510 100" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 725 100 L 750 100" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="335" y="112" fill="#6b7280" font-family="sans-serif" font-size="8" text-anchor="middle">вытяжка →</text>

  <!-- Приточный канал (Нижний) -->
  <rect x="80" y="170" width="690" height="60" fill="#1e2227" stroke="#374151" stroke-width="2" />
  <text x="32" y="205" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">УЛИЦА</text>
  
  <!-- Стрелки и подписи направления в приточном канале -->
  <path d="M 85 200 L 95 200" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 335 200 L 350 200" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 480 200 L 485 200" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 725 200 L 750 200" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="335" y="212" fill="#6b7280" font-family="sans-serif" font-size="8" text-anchor="middle">приток →</text>
  
  <!-- Выходные метки -->
  <text x="785" y="105" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">НА УЛИЦУ</text>
  <text x="785" y="205" fill="#5eead4" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">В ЗДАНИЕ</text>


  <!-- ================= ЭЛЕМЕНТЫ ВЫТЯЖНОГО КАНАЛА (ВЕРХ) ================= -->
  
  <!-- 1. Вытяжной вентилятор ВСК (0.75 кВт) -->
  <g transform="translate(140, 75)">
    <rect width="70" height="50" rx="5" fill="#2d3139" stroke="#4b5563" />
    <circle cx="35" cy="25" r="18" fill="#111317" stroke="#ef4444" stroke-width="1.5" />
    <!-- Пропеллер -->
    <path d="M35 25 L35 10 M35 25 L48 32 M35 25 L22 32" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />
    <text x="35" y="42" fill="#e5e7eb" font-family="sans-serif" font-size="8" text-anchor="middle">Вент. ВСК</text>
    <text x="35" y="-4" fill="#9ca3af" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">ВЫТЯЖКА</text>
  </g>

  <!-- 2. Шумоглушитель вытяжной -->
  <g transform="translate(240, 75)">
    <rect width="80" height="50" rx="3" fill="#23272f" stroke="#4b5563" stroke-dasharray="4 2" />
    <text x="40" y="29" fill="#9ca3af" font-family="sans-serif" font-size="9" text-anchor="middle">Шумоглушитель</text>
  </g>

  <!-- 3. Вытяжная заслонка передняя с клапаном РРК -->
  <g transform="translate(660, 75)">
    <rect width="50" height="50" rx="4" fill="#374151" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Жалюзи внутри -->
    <line x1="670" y1="85" x2="700" y2="85" stroke="#f59e0b" stroke-width="2" />
    <line x1="670" y1="100" x2="700" y2="100" stroke="#f59e0b" stroke-width="2" />
    <line x1="670" y1="114" x2="700" y2="114" stroke="#f59e0b" stroke-width="2" />
    <text x="25" y="43" fill="#e5e7eb" font-family="sans-serif" font-size="8" text-anchor="middle">Клапан РРК</text>
    <text x="25" y="-4" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">ОТСЕЧНОЙ</text>
  </g>


  <!-- ================= СВЯЗУЮЩИЙ УЗЕЛ: РОТОРНЫЙ РЕКУПЕРАТОР ================= -->
  <g transform="translate(360, 85)">
    <!-- Корпус рекуператора, пересекающий оба канала -->
    <rect width="110" height="130" rx="8" fill="#1f232b" stroke="#6b7280" stroke-width="2" />
    <!-- Вращающийся барабан -->
    <circle cx="55" cy="65" r="50" fill="#111317" stroke="#4b5563" stroke-width="2" />
    <!-- Разделение секторов теплообмена -->
    <line x1="55" y1="15" x2="55" y2="115" stroke="#4b5563" />
    <line x1="5" y1="65" x2="105" y2="65" stroke="#6b7280" stroke-dasharray="2 2" />
    <circle cx="55" cy="65" r="8" fill="#374151" />
    
    <!-- Подсветка работы -->
    <text x="55" y="32" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ТЕПЛОСЪЕМ</text>
    <text x="55" y="105" fill="#22c55e" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ПОДОГРЕВ</text>
    <text x="55" y="69" fill="#e5e7eb" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">РОТОР</text>
  </g>


  <!-- ================= ЭЛЕМЕНТЫ ПРИТОЧНОГО КАНАЛА (НИЗ) ================= -->
  
  <!-- 1. Входной отсечной клапан РРК (улица) -->
  <g transform="translate(100, 175)">
    <rect width="50" height="50" rx="4" fill="#374151" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="110" y1="185" x2="140" y2="185" stroke="#f59e0b" stroke-width="2" />
    <line x1="110" y1="200" x2="140" y2="200" stroke="#f59e0b" stroke-width="2" />
    <line x1="110" y1="214" x2="140" y2="214" stroke="#f59e0b" stroke-width="2" />
    <text x="25" y="43" fill="#e5e7eb" font-family="sans-serif" font-size="8" text-anchor="middle">Клапан РРК</text>
    <text x="25" y="-4" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">ОТСЕЧНОЙ</text>
  </g>

  <!-- 2. Секция фильтрации G3 + M5 -->
  <g transform="translate(170, 175)">
    <rect width="65" height="50" rx="3" fill="#2d3139" stroke="#4b5563" />
    <!-- Складки фильтров -->
    <path d="M 180 180 L 185 220 L 190 180 L 195 220 L 200 180 L 205 220 L 210 180" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M 215 180 L 220 220 L 225 180 L 230 220" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="32" y="43" fill="#e5e7eb" font-family="sans-serif" font-size="8" text-anchor="middle">Кассета фильтра</text>
    <text x="32" y="-4" fill="#9ca3af" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">ФИЛЬТРЫ</text>
  </g>

  <!-- [Промежуточная камера и Ротор находятся здесь, в координатах x=360] -->

  <!-- 3. Жидкостный воздухонагреватель ВНВ (Калорифер) -->
  <g transform="translate(490, 175)">
    <rect width="60" height="50" rx="4" fill="#2d3139" stroke="#ef4444" stroke-width="1.5" />
    <!-- Имитация трубок радиатора -->
    <path d="M500 185 L500 215 L510 215 L510 185 L520 185 L520 215 L530 215 L530 185" fill="none" stroke="#ef4444" stroke-width="2" />
    <text x="30" y="43" fill="#e5e7eb" font-family="sans-serif" font-size="8" text-anchor="middle">Калорифер</text>
    <text x="30" y="-4" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">НАГРЕВ</text>
    
    <!-- Выносная метка регулирующего узла ВЕКТОР -->
    <path d="M 520 225 L 520 250" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />
    <rect x="480" y="250" width="80" height="18" rx="3" fill="#ef4444" />
    <text x="520" y="262" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ВЕКТОР (Y1)</text>
  </g>

  <!-- 4. Основной приточный вентилятор ВСК (4 кВт) -->
  <g transform="translate(570, 175)">
    <rect width="80" height="50" rx="5" fill="#2d3139" stroke="#4b5563" />
    <!-- Обозначение сдвоенного вентилятора / стены -->
    <circle cx="30" cy="25" r="16" fill="#111317" stroke="#22c55e" stroke-width="2" filter="url(#glow-green)" />
    <circle cx="55" cy="25" r="16" fill="#111317" stroke="#22c55e" stroke-width="2" filter="url(#glow-green)" />
    <text x="40" y="43" fill="#e5e7eb" font-family="sans-serif" font-size="8" text-anchor="middle">Стена FanWall</text>
    <text x="40" y="-4" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">ПРИТОК</text>
  </g>

  <!-- 5. Шумоглушитель приточный -->
  <g transform="translate(670, 175)">
    <rect width="80" height="50" rx="3" fill="#23272f" stroke="#4b5563" stroke-dasharray="4 2" />
    <text x="40" y="29" fill="#9ca3af" font-family="sans-serif" font-size="9" text-anchor="middle">Шумоглушитель</text>
  </g>

</svg>
