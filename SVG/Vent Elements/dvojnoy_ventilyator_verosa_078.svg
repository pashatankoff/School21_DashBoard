<?xml version="1.0" encoding="UTF-8"?>
<!--
  Сдвоенный блок приточных вентиляторов (FanWall) для установки ВЕРОСА-500-078.
  Размер элемента: 333.3334 x 166.6667 px (состоит из двух секций по 166.6667 px).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="333.3334"
  height="166.6667"
  viewBox="0 0 200 100"
  id="svg-dvoynoy-ventilyator-verosa">
  <defs>
    <!-- Общая маска обрезки углов для вытянутого блока -->
    <clipPath id="tpl_tile_clip_double">
      <rect x="0.75" y="0.75" width="198.5" height="98.5" rx="8" ry="8"/>
    </clipPath>

    <!-- Фон центральной части -->
    <linearGradient id="inner-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2d32"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>

    <!-- Изумрудное свечение за кулерами -->
    <radialGradient id="glow-green-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="1"/>
      <stop offset="45%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#166534" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <!-- Градиент для подложки вентилятора -->
    <radialGradient id="back-disc-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f444a"/>
      <stop offset="100%" stop-color="#24272b"/>
    </radialGradient>

    <!-- Матовый пластик лопастей -->
    <linearGradient id="blade-dark-grad" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#1e2124"/>
      <stop offset="70%" stop-color="#2a2e33"/>
      <stop offset="100%" stop-color="#383d44"/>
    </linearGradient>

    <!-- Шаблон одной каплевидной лопасти -->
    <g id="blade-v4">
      <path d="M 200 200 
               C 175 160, 160 110, 180 70 
               C 192 45, 218 45, 225 70 
               C 235 110, 215 160, 200 200 Z" 
            fill="url(#blade-dark-grad)" 
            stroke="#151719" 
            stroke-width="1" />
      <path d="M 190 130 C 182 105, 190 80, 205 60" 
            fill="none" 
            stroke="#4b525a" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            opacity="0.4"/>
    </g>

    <!-- Готовый вентилятор в сборе с анимацией вращения -->
    <g id="full-fan-unit">
      <!-- Зеленый ореол -->
      <circle cx="50" cy="50" r="38" fill="url(#glow-green-bg)"/>
      
      <!-- Конструкция кулера (вписана в локальные координаты 0..100) -->
      <g transform="translate(50,50) scale(0.155) translate(-200,-200)">
        <circle cx="200" cy="200" r="75" fill="url(#back-disc-grad)" stroke="#1a1c1e" stroke-width="2" />
        <circle cx="200" cy="200" r="62" fill="none" stroke="#2e3237" stroke-width="1" opacity="0.5" />

        <!-- 6 лопастей -->
        <g>
          <use xlink:href="#blade-v4" transform="rotate(0, 200, 200)" />
          <use xlink:href="#blade-v4" transform="rotate(60, 200, 200)" />
          <use xlink:href="#blade-v4" transform="rotate(120, 200, 200)" />
          <use xlink:href="#blade-v4" transform="rotate(180, 200, 200)" />
          <use xlink:href="#blade-v4" transform="rotate(240, 200, 200)" />
          <use xlink:href="#blade-v4" transform="rotate(300, 200, 200)" />
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 200 200" to="360 200 200"
            dur="2.5s"
            repeatCount="indefinite"/>
        </g>

        <!-- Втулка -->
        <circle cx="200" cy="200" r="24" fill="#282b30" stroke="#151719" stroke-width="2" />
        <circle cx="200" cy="200" r="18" fill="none" stroke="#484f57" stroke-width="1.2" opacity="0.6" />
        <circle cx="200" cy="200" r="6" fill="#151719" />
      </g>
    </g>
  </defs>

  <g id="verosa_double_fan_block">
    <!-- Общая внешняя рамка блока -->
    <rect id="frame_border"
      x="0.75" y="0.75" width="198.5" height="98.5"
      rx="8" ry="8"
      fill="none"
      stroke="#d1d5db"
      stroke-width="1.5"/>

    <g clip-path="url(#tpl_tile_clip_double)">
      <!-- Общий фон плитки -->
      <rect id="mid_band" width="200" height="100" fill="url(#inner-bg)"/>

      <!-- Фон единого верхнего заголовка -->
      <rect id="top_band" x="0.75" y="0.75" width="198.5" height="19.25" fill="#23272e"/>
      <line id="top_sep" x1="0.75" y1="20" x2="199.25" y2="20" stroke="#3b4048" stroke-width="1"/>

      <!-- Фон единой нижней зоны статуса -->
      <rect id="bottom_band" x="0.75" y="80" width="198.5" height="19.25" fill="#23272e"/>
      <line id="bottom_sep" x1="0.75" y1="80" x2="199.25" y2="80" stroke="#3b4048" stroke-width="1"/>

      <!-- ================= ЦЕНТРАЛЬНАЯ РАБОЧАЯ ЗОНА ================= -->
      <!-- Левый вентилятор (смещен на четверть общей ширины: x = 50) -->
      <g transform="translate(0, 0)">
        <use xlink:href="#full-fan-unit"/>
      </g>

      <!-- Правый вентилятор (смещен на три четверти общей ширины: x = 150) -->
      <g transform="translate(100, 0)">
        <use xlink:href="#full-fan-unit"/>
      </g>
    </g>

    <!-- Общий заголовок по центру -->
    <text id="pos_value"
      x="100" y="14.5"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="11"
      font-weight="700"
      fill="#e5e7eb">&#x412;&#x415;&#x420;&#x41E;&#x421;&#x410;-078 &#x412;&#x435;&#x43D;&#x442;&#x441;&#x442;&#x435;&#x43D;&#x430;</text>

    <!-- Общий статус (ВКЛ) -->
    <text id="status_text"
      x="100" y="93"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="0.5"
      fill="#e5e7eb">&#x412;&#x41A;&#x41B; (2 &#x444;&#x430;&#x43D;&#x430;)</text>
  </g>
</svg>
