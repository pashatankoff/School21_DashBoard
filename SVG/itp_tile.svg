<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="420"
  height="250"
  viewBox="0 0 420 250"
  version="1.1"
  id="svg-itp-tile"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <g id="itp_tile">
    <rect
      id="tile_bg"
      x="2"
      y="2"
      width="416"
      height="246"
      rx="16"
      ry="16"
      fill="#151e32"
      stroke="#2a3a55"
      stroke-width="2" />

    <text
      id="name_text"
      x="24"
      y="42"
      font-size="28px"
      font-family="Segoe UI, Sans"
      font-weight="700"
      letter-spacing="0.5px"
      fill="#94a3b8">&#1048;&#1058;&#1055;</text>

    <g id="row_supply">
      <text
        id="supply_label"
        x="24"
        y="98"
        font-size="24px"
        font-family="Segoe UI, Sans"
        font-weight="600"
        fill="#94a3b8">&#1058; &#1087;&#1086;&#1076;&#1072;&#1095;&#1080;</text>
      <text
        id="supply_value"
        x="330"
        y="98"
        text-anchor="end"
        font-size="32px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#38bdf8">65.2</text>
      <text
        id="supply_unit"
        x="392"
        y="98"
        text-anchor="end"
        font-size="32px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#94a3b8">&#176;C</text>
    </g>

    <g id="row_return">
      <text
        id="return_label"
        x="24"
        y="148"
        font-size="24px"
        font-family="Segoe UI, Sans"
        font-weight="600"
        fill="#94a3b8">&#1058; &#1086;&#1073;&#1088;&#1072;&#1090;&#1082;&#1080;</text>
      <text
        id="return_value"
        x="330"
        y="148"
        text-anchor="end"
        font-size="32px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#38bdf8">48.1</text>
      <text
        id="return_unit"
        x="392"
        y="148"
        text-anchor="end"
        font-size="32px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#94a3b8">&#176;C</text>
    </g>

    <g id="row_delta">
      <text
        id="delta_label"
        x="24"
        y="198"
        font-size="24px"
        font-family="Segoe UI, Sans"
        font-weight="600"
        fill="#94a3b8">&#916;T</text>
      <text
        id="delta_value"
        x="330"
        y="198"
        text-anchor="end"
        font-size="32px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#38bdf8">17.1</text>
      <text
        id="delta_unit"
        x="392"
        y="198"
        text-anchor="end"
        font-size="32px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#94a3b8">&#176;C</text>
    </g>
