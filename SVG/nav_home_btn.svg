<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="100"
  height="90"
  viewBox="0 0 100 90"
  version="1.1"
  id="svg-nav-home-btn"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <g id="btn_content">
      <g
        id="btn_icon"
        transform="translate(32,12) scale(1.5)"
        fill="none"
        stroke="currentColor"
        stroke-width="2">
        <path id="icon_house" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline id="icon_door" points="9 22 9 12 15 12 15 22" />
      </g>
      <text
        id="name_text"
        x="50"
        y="70"
        text-anchor="middle"
        font-size="12px"
        font-family="Segoe UI, Sans"
        font-weight="600"
        fill="currentColor">&#1043;&#1083;&#1072;&#1074;&#1085;&#1072;&#1103;</text>
    </g>
  </defs>
  <style type="text/css" id="style1"><![CDATA[
    .state_idle, .state_hover, .state_active { display: none; }
    g.Idle .state_idle { display: inline; }
    g.Hover .state_hover { display: inline; }
    g.Active .state_active { display: inline; }
    g.Off { display: none; }
    g.On { display: inline; }
  ]]></style>
  <g id="nav_btn" class="Idle">
    <rect
      id="btn_bg_idle"
      class="state_idle"
      x="0"
      y="0"
      width="100"
      height="90"
      rx="8"
      ry="8"
      fill="transparent" />
    <rect
      id="btn_bg_hover"
      class="state_hover"
      x="0"
      y="0"
      width="100"
      height="90"
      rx="8"
      ry="8"
      fill="#1e293b" />
    <rect
      id="btn_bg_active"
      class="state_active"
      x="0"
      y="0"
      width="100"
      height="90"
      rx="8"
      ry="8"
      fill="#1e293b" />

    <use id="content_idle" class="state_idle" xlink:href="#btn_content" href="#btn_content" color="#94a3b8" />
    <use id="content_hover" class="state_hover" xlink:href="#btn_content" href="#btn_content" color="#f8fafc" />
    <use id="content_active" class="state_active" xlink:href="#btn_content" href="#btn_content" color="#38bdf8" />

    <g id="badge" class="On">
      <circle
        id="badge_circle"
        cx="81"
        cy="19"
        r="11"
        fill="#ef4444" />
      <text
        id="badge_text"
        x="81"
        y="23"
        text-anchor="middle"
        font-size="12px"
        font-family="Segoe UI, Sans"
        font-weight="800"
        fill="#ffffff">3</text>
    </g>
  </g>
</svg>
