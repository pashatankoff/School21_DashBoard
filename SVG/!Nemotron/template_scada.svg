<?xml version="1.0" encoding="UTF-8"?>
<!--
  Template - zagotovka elementa dlya MasterSCADA.
  Koordinatnaya sistema: 100x100 (viewBox).
  Masshtab vyvoda: 166.6667 px (~500/3) - srednyaya zona (60 edinic,
  y = 20..80) na ekrane rovno 100 px.

  Eto universal'naya zagotovka dlya elementov mnemoshemy.
  Verhnyaya zona - nazvanie elementa, nizhnyaya zona - parametr (odin cvet).
  Central'naya zona (y=20..80) pustaya - dlya dobavleniya grafiki elementa.

  Privyazki (sm. parnyj fajl template_scada.xml):
    #pos_value     Content    - tekst verhney zony (nazvanie elementa)
    #pos_value     visibility - vidimost' teksta
    #pos_value     fill       - cvet teksta zagolovka
    #status_text   Content    - tekst nizhnej zony (parametr)
    #status_text   fill       - cvet teksta nizhnej zony
    #top_band      fill       - fon zagolovka
    #mid_band      fill       - fon central'noj chasti
    #bottom_band   fill       - fon nizhnej zony
    #frame_border  stroke     - cvet ramki

  Russkij tekst zadan XML-kodami simvolov (&#x...;), chtoby fajl
  ostavalsya chisto ASCII i ne zavisel ot kodirovki.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="166.6667"
  height="166.6667"
  viewBox="0 0 100 100"
  id="svg-template-scada">
  <defs>
    <clipPath id="tpl_tile_clip">
      <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="8" ry="8"/>
    </clipPath>

    <!-- Gradient fona central'noy chasti -->
    <linearGradient id="inner-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2d32"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>
  </defs>

  <g id="template_scada">

    <!-- Ramka; vneshnij gabarit rovno 100x100 v viewBox -->
    <rect id="frame_border"
      x="0.75" y="0.75" width="98.5" height="98.5"
      rx="8" ry="8"
      fill="none"
      stroke="#d1d5db"
      stroke-width="1.5"/>

    <g clip-path="url(#tpl_tile_clip)">

      <!-- Fon central'noj chasti s gradientom -->
      <rect id="mid_band" x="0.75" y="0.75" width="98.5" height="98.5" fill="url(#inner-bg)"/>

      <!-- Fon zagolovka (verhnyaya zona - nazvanie elementa) -->
      <rect id="top_band" x="0.75" y="0.75" width="98.5" height="19.25" fill="#23272e"/>
      <line id="top_sep" x1="0.75" y1="20" x2="99.25" y2="20" stroke="#3b4048" stroke-width="1"/>

      <!-- Fon nizhnej zony (parametr) -->
      <rect id="bottom_band" x="0.75" y="80" width="98.5" height="19.25" fill="#23272e"/>
      <line id="bottom_sep" x1="0.75" y1="80" x2="99.25" y2="80" stroke="#3b4048" stroke-width="1"/>

      <!-- Central'naya zona pustaya - dlya grafiki elementa -->
    </g>

    <!-- Zagolovok: nazvanie elementa -->
    <text id="pos_value"
      x="50" y="14.5"
      visibility="visible"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="11"
      font-weight="700"
      fill="#e5e7eb">&#x41D;&#x430;&#x437;&#x432;&#x430;&#x43D;&#x438;&#x435;</text>

    <!-- Nizhnyaya zona: parametr (tot zhe cvet, chto i zagolovok) -->
    <text id="status_text"
      x="50" y="93"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="0.5"
      fill="#e5e7eb">&#x41F;&#x430;&#x440;&#x430;&#x43C;&#x435;&#x442;&#x440;</text>
  </g>
</svg>