<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="408"
  height="299"
  viewBox="0 0 408 299"
  version="1.1"
  id="svg-ac-tile"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <style type="text/css" id="style1"><![CDATA[
    g.Off { display: none; }
    g.On { display: inline; }
  ]]></style>
  <g id="ac_tile">
    <rect
      id="tile_bg"
      x="2"
      y="2"
      width="404"
      height="295"
      rx="12"
      ry="12"
      fill="#151e32"
      stroke="#2a3a55"
      stroke-width="2" />

    <text
      id="name_text"
      x="14"
      y="36"
      font-size="28px"
      font-family="Segoe UI, Sans"
      font-weight="700"
      letter-spacing="0.5px"
      fill="#94a3b8">&#1050;&#1054;&#1053;&#1044;&#1048;&#1062;&#1048;&#1054;&#1053;&#1045;&#1056;&#1067;</text>

    <text
      id="value_line"
      x="14"
      y="142"
      font-family="Segoe UI, Sans"
      font-weight="800"
      fill="#94a3b8"><tspan
        id="on_value"
        font-size="72px"
        fill="#f8fafc">19</tspan><tspan
        id="unit_slash"
        font-size="36px"> / </tspan><tspan
        id="total_value"
        font-size="36px">24</tspan></text>

    <g id="label_group" fill="#94a3b8">
      <text
        id="on_label"
        x="14"
        y="188"
        font-size="28px"
        font-family="Segoe UI, Sans"
        font-weight="600">&#1088;&#1072;&#1073;&#1086;&#1090;&#1072;&#1102;&#1090;</text>
      <text
        id="zones_line"
        x="14"
        y="218"
        font-size="20px"
        font-family="Segoe UI, Sans"
        font-weight="600"><tspan
          id="zones_prefix">&#1079;&#1086;&#1085;&#1099; </tspan><tspan
          id="zone_min_value">20.8</tspan><tspan
          id="zones_sep">&#8230;</tspan><tspan
          id="zone_max_value">28.1</tspan><tspan
          id="zones_unit"> &#176;C</tspan></text>
    </g>

    <g id="ac_alarm" class="On">
      <rect
        id="alarm_bg"
        x="14"
        y="232"
        width="380"
        height="56"
        rx="8"
        ry="8"
        fill="#ef4444"
        fill-opacity="0.15" />
      <text
        id="alarm_text"
        x="30"
        y="269"
        font-size="26px"
        font-family="Segoe UI, Sans"
        font-weight="700"
        fill="#ef4444">&#1085;&#1077; &#1086;&#1093;&#1083;&#1072;&#1078;&#1076;&#1072;&#1077;&#1090;: &#1050;-07</text>
    </g>
  </g>
</svg>
