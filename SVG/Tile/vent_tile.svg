<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="408"
  height="299"
  viewBox="0 0 408 299"
  version="1.1"
  id="svg-vent-tile"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <style type="text/css" id="style1"><![CDATA[
    g.Off { display: none; }
    g.On { display: inline; }
  ]]></style>
  <g id="vent_tile">
    <rect
      id="tile_bg"
      x="2"
      y="2"
      width="404"
      height="295"
      rx="12"
      ry="12"
      fill="#151e32"
      stroke="#2a3a55"
      stroke-width="2" />

    <text
      id="name_text"
      x="14"
      y="36"
      font-size="28px"
      font-family="Segoe UI, Sans"
      font-weight="700"
      letter-spacing="0.5px"
      fill="#94a3b8">&#1042;&#1045;&#1053;&#1058;&#1048;&#1051;&#1071;&#1062;&#1048;&#1071;</text>

    <text
      id="value_line"
      x="14"
      y="148"
      font-family="Segoe UI, Sans"
      font-weight="800"
      fill="#94a3b8"><tspan
        id="on_value"
        font-size="72px"
        fill="#f8fafc">6</tspan><tspan
        id="unit_slash"
        font-size="36px"> / </tspan><tspan
        id="total_value"
        font-size="36px">8</tspan></text>

    <g id="label_group" fill="#94a3b8">
      <text
        id="on_label"
        x="14"
        y="196"
        font-size="28px"
        font-family="Segoe UI, Sans"
        font-weight="600">&#1088;&#1072;&#1073;&#1086;&#1090;&#1072;&#1102;&#1090;</text>
    </g>

    <g id="vent_alarm" class="On">
      <rect
        id="alarm_bg"
        x="14"
        y="222"
        width="380"
        height="56"
        rx="8"
        ry="8"
        fill="#ef4444"
        fill-opacity="0.15" />
      <text
        id="alarm_text"
        x="30"
        y="259"
        font-size="26px"
        font-family="Segoe UI, Sans"
        font-weight="700"
        fill="#ef4444">1 &#1072;&#1074;&#1072;&#1088;. &#183; &#1055;2</text>
    </g>
  </g>
</svg>
