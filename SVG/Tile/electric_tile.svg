      fill="#94a3b8">&#1069;&#1051;&#1045;&#1050;&#1058;&#1056;&#1054;&#1057;&#1053;&#1040;&#1041;&#1046;&#1045;&#1053;&#1048;&#1045;</text>

    <g id="label_group" fill="#94a3b8">
