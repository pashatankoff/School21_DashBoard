  height="299"
  viewBox="0 0 408 299"
  version="1.1"
  id="svg-electric-tile"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <filter id="glow_green" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#22c55e" flood-opacity="0.9" />
    </filter>
    <filter id="glow_red" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#ef4444" flood-opacity="0.9" />
    </filter>
  </defs>
  <style type="text/css" id="style1"><![CDATA[
    .state_off { display: none; }
    .state_on { display: inline; }
    g.Off .state_on { display: none; }
    g.Off .state_off { display: inline; }
    .status_text { display: inline; }
  ]]></style>
  <g id="electric_tile">
