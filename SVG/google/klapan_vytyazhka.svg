<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vytyazhnaya zaslonka (exhaust damper).
  Russkij tekst zadan XML-kodami simvolov (&#x...;), chtoby fajl
  ostavalsya chisto ASCII i ne zavisel ot kodirovki.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="100"
  viewBox="0 0 100 100"
  id="svg-exhaust-damper">
  <defs>
    <style type="text/css"><![CDATA[
      #exhaust_damper_tile.open #status_text { fill: #4ade80; }
      #exhaust_damper_tile.closed #status_text { fill: #94a3b8; }
      #exhaust_damper_tile.partial #status_text { fill: #fbbf24; }
      #exhaust_damper_tile.fault #status_text { fill: #ef4444; }

      #exhaust_damper_tile.closed #blade_1,
      #exhaust_damper_tile.closed #blade_2,
      #exhaust_damper_tile.closed #blade_3 {
        transform-box: fill-box;
        transform-origin: center;
        transform: rotate(0deg);
      }
      #exhaust_damper_tile.open #blade_1,
      #exhaust_damper_tile.open #blade_2,
      #exhaust_damper_tile.open #blade_3 {
        transform-box: fill-box;
        transform-origin: center;
        transform: rotate(70deg);
      }
      #exhaust_damper_tile.partial #blade_1,
      #exhaust_damper_tile.partial #blade_2,
      #exhaust_damper_tile.partial #blade_3 {
        transform-box: fill-box;
        transform-origin: center;
        transform: rotate(35deg);
      }
    ]]></style>
  </defs>

  <!-- class: open | closed | partial | fault -->
  <g id="exhaust_damper_tile" class="open">

    <!-- Fon + svetlaya ramka (vneshnij gabarit rovno 100x100) -->
    <rect id="tile_bg"
      x="0.75" y="0.75" width="98.5" height="98.5"
      rx="8" ry="8"
      fill="#1a1d21"
      stroke="#d1d5db"
      stroke-width="1.5"/>

    <!-- Zagolovok: "Vytyazhnaya zaslonka" -->
    <text id="title_text"
      x="50" y="16"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="600"
      fill="#e5e7eb">
      <tspan x="50" dy="0">&#x412;&#x44B;&#x442;&#x44F;&#x436;&#x43D;&#x430;&#x44F;</tspan>
      <tspan x="50" dy="11">&#x437;&#x430;&#x441;&#x43B;&#x43E;&#x43D;&#x43A;&#x430;</tspan>
    </text>

    <!-- Ramka ikonki -->
    <rect id="icon_frame"
      x="30" y="32" width="40" height="46"
      rx="4" ry="4"
      fill="none"
      stroke="#d1d5db"
      stroke-width="1.2"/>

    <!-- Korpus klapana -->
    <rect id="valve_body"
      x="40" y="37" width="20" height="36"
      rx="10" ry="10"
      fill="#111418"
      stroke="#6b7280"
      stroke-width="1"/>

    <!-- Lameli -->
    <g id="blades" fill="#d1d5db">
      <g id="blade_1" transform="translate(50,45)">
        <ellipse cx="0" cy="0" rx="7" ry="3"/>
        <circle cx="0" cy="0" r="1" fill="#1a1d21"/>
      </g>
      <g id="blade_2" transform="translate(50,55)">
        <ellipse cx="0" cy="0" rx="7" ry="3"/>
        <circle cx="0" cy="0" r="1" fill="#1a1d21"/>
      </g>
      <g id="blade_3" transform="translate(50,65)">
        <ellipse cx="0" cy="0" rx="7" ry="3"/>
        <circle cx="0" cy="0" r="1" fill="#1a1d21"/>
      </g>
    </g>

    <!-- Status: OTKRYTA -->
    <text id="status_text"
      x="50" y="92"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="0.5"
      fill="#4ade80">&#x41E;&#x422;&#x41A;&#x420;&#x42B;&#x422;&#x410;</text>
  </g>
</svg>
