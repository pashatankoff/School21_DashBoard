<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="100"
  viewBox="0 0 100 100"
  id="svg-supply-damper">
  <defs>
    <style type="text/css"><![CDATA[
      #damper_tile.open #status_text { fill: #4ade80; }
      #damper_tile.closed #status_text { fill: #94a3b8; }
      #damper_tile.partial #status_text { fill: #fbbf24; }
      #damper_tile.fault #status_text { fill: #ef4444; }

      #damper_tile.closed #blade_1,
      #damper_tile.closed #blade_2,
      #damper_tile.closed #blade_3 {
        transform-box: fill-box;
        transform-origin: center;
        transform: rotate(0deg);
      }
      #damper_tile.open #blade_1,
      #damper_tile.open #blade_2,
      #damper_tile.open #blade_3 {
        transform-box: fill-box;
        transform-origin: center;
        transform: rotate(70deg);
      }
      #damper_tile.partial #blade_1,
      #damper_tile.partial #blade_2,
      #damper_tile.partial #blade_3 {
        transform-box: fill-box;
        transform-origin: center;
        transform: rotate(35deg);
      }
    ]]></style>
  </defs>

  <!-- class: open | closed | partial | fault -->
  <g id="damper_tile" class="open">

    <!-- Фон + светлая рамка -->
    <rect id="tile_bg"
      x="1.5" y="1.5" width="97" height="97"
      rx="8" ry="8"
      fill="#1a1d21"
      stroke="#d1d5db"
      stroke-width="1.5"/>

    <!-- Заголовок -->
    <text id="title_text"
      x="50" y="16"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="600"
      fill="#e5e7eb">
      <tspan x="50" dy="0">Приточная</tspan>
      <tspan x="50" dy="11">заслонка</tspan>
    </text>

    <!-- Рамка иконки -->
    <rect id="icon_frame"
      x="30" y="32" width="40" height="46"
      rx="4" ry="4"
      fill="none"
      stroke="#d1d5db"
      stroke-width="1.2"/>

    <!-- Корпус клапана -->
    <rect id="valve_body"
      x="40" y="37" width="20" height="36"
      rx="10" ry="10"
      fill="#111418"
      stroke="#6b7280"
      stroke-width="1"/>

    <!-- Ламели -->
    <g id="blades" fill="#d1d5db">
      <g id="blade_1" transform="translate(50,45)">
        <ellipse cx="0" cy="0" rx="7" ry="3"/>
        <circle cx="0" cy="0" r="1" fill="#1a1d21"/>
      </g>
      <g id="blade_2" transform="translate(50,55)">
        <ellipse cx="0" cy="0" rx="7" ry="3"/>
        <circle cx="0" cy="0" r="1" fill="#1a1d21"/>
      </g>
      <g id="blade_3" transform="translate(50,65)">
        <ellipse cx="0" cy="0" rx="7" ry="3"/>
        <circle cx="0" cy="0" r="1" fill="#1a1d21"/>
      </g>
    </g>

    <!-- Статус -->
    <text id="status_text"
      x="50" y="92"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="0.5"
      fill="#4ade80">ОТКРЫТА</text>
  </g>
</svg>